name: UI smoke

# Visits every dashboard route and the UI states in scripts/ui-smoke/states.json
# (dialogs, drawers, menus) in Chromium (desktop + touch-phone viewport) on a
# demo-seeded production build and fails on new horizontal overflow, console
# errors, failing same-origin requests, small mobile tap targets and serious axe
# violations. Known issues: scripts/ui-smoke/baseline.txt. Local: `bun run smoke`.
#
# Pull requests check only the routes/states their changes can affect, plus a
# core set (scripts/ui-smoke/affected.mjs); master and manual runs check everything.
#
# Security: plain `pull_request` (never pull_request_target), read-only token,
# no secrets. Fork PRs run with the same read-only permissions.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Chromium and its system libraries are preinstalled in the image, so no
    # per-run apt-get. Keep the tag in step with the pinned playwright-core.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # A PR checks out its merge commit, so HEAD^1 is the base and the diff is the PR.
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # Webpack's persistent cache for the smoke's `next build` (.next-smoke, several
      # hundred MB). Every run restores the newest one; only master saves, and only
      # when the sources changed, so PRs don't fill the 10 GB Actions cache.
      - name: Restore Next build cache
        uses: actions/cache/restore@v4
        with:
          path: .next-smoke/cache
          key: next-smoke-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'open-sse/**', 'next.config.mjs') }}
          restore-keys: next-smoke-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Smoke test
        run: node scripts/ui-smoke.mjs --out ui-smoke ${{ github.event_name == 'pull_request' && '--changed HEAD^1' || '' }}

      - name: Save Next build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: .next-smoke/cache
          key: next-smoke-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'open-sse/**', 'next.config.mjs') }}

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-smoke
          path: ui-smoke/
          retention-days: 14
